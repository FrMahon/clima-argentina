[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clima-argentina"
version = "0.1.0"
description = "Pipeline ELT de temperatura histórica de Argentina: Open-Meteo (ERA5) → DuckDB → dbt → dashboard"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "duckdb>=1.5,<2",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
clima = "clima.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
