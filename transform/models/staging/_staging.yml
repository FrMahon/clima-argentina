version: 2

models:
  - name: stg_open_meteo__daily
    description: Datos diarios renombrados y tipados. Una fila por ciudad y día.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, weather_date]
    columns:
      - name: city_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: weather_date
        data_tests: [not_null]
      - name: temp_mean_c
        description: Temperatura media diaria a 2 m (°C).
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: -40, max_value: 45}
      - name: temp_max_c
        description: Temperatura máxima diaria a 2 m (°C).
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: -35, max_value: 55}
      - name: temp_min_c
        description: Temperatura mínima diaria a 2 m (°C).
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: -45, max_value: 40}
      - name: precipitation_mm
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 500}
      - name: source_model
        data_tests:
          - accepted_values:
              arguments:
                values: ["era5"]

  - name: stg_cities
    description: Ciudades del seed `cities`.
    columns:
      - name: city_id
        data_tests: [unique, not_null]
